apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: simulated-bmh
  namespace: openshift-machine-api
spec:
  bmc:
    address: redfish-virtualmedia://192.168.125.1:9000/redfish/v1/Systems/local/sno-abi
    credentialsName: simulated-bmh-bmc
    disableCertificateVerification: true
  bootMACAddress: "aa:aa:aa:aa:03:01"
  bootMode: UEFI
  online: true
  rootDeviceHints:
    deviceName: /dev/vda
