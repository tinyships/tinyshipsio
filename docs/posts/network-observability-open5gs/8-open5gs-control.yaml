    spec:
      serviceAccountName: open5gs-sa
      containers:
        - name: smf
          image: docker.io/gradiant/open5gs:2.7.6
          command: ["open5gs-smfd"]
          args: ["-c", "/etc/open5gs/custom/smf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 8805
              name: pfcp
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs/custom
      volumes:
        - name: config
          configMap:
            name: smf-config
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: open5gs-control
spec:
  selector:
    app: smf
  ports:
    - port: 7777
      targetPort: 7777
