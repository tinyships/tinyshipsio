apiVersion: v1
kind: Namespace
metadata:
  name: open5gs-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open5gs-sa
  namespace: open5gs-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amf-config
  namespace: open5gs-control
data:
  amf.yaml: |
    logger:
      level: info

    amf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          scp:
            - uri: http://scp.open5gs-core.svc.cluster.local:7777
      ngap:
        server:
          - address: 0.0.0.0
      guami:
        - plmn_id:
            mcc: 001
            mnc: 01
          amf_id:
            region: 2
            set: 1
      tai:
        - plmn_id:
            mcc: 001
            mnc: 01
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: 001
            mnc: 01
          s_nssai:
            - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Open5GS
        short: Next
      amf_name: open5gs-amf0
      time:
        t3512:
          value: 540
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: open5gs-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amf
  template:
    metadata:
      labels:
        app: amf
    spec:
      serviceAccountName: open5gs-sa
      containers:
        - name: amf
          image: docker.io/gradiant/open5gs:2.7.6
          command: ["open5gs-amfd"]
          args: ["-c", "/etc/open5gs/custom/amf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 38412
              name: ngap
              protocol: SCTP
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs/custom
      volumes:
        - name: config
          configMap:
            name: amf-config
---
apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: open5gs-control
spec:
  selector:
    app: amf
  ports:
    - port: 7777
      targetPort: 7777
      name: sbi
    - port: 38412
      targetPort: 38412
      protocol: SCTP
      name: ngap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: open5gs-control
data:
  smf.yaml: |
    logger:
      level: info

    smf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          scp:
            - uri: http://scp.open5gs-core.svc.cluster.local:7777
      pfcp:
        server:
          - address: 0.0.0.0
        client:
          upf:
            - address: upf.open5gs-data.svc.cluster.local
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
      gtpu:
        server:
          - address: 0.0.0.0
      dns:
        - 8.8.8.8
        - 8.8.4.4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: open5gs-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smf
  template:
    metadata:
